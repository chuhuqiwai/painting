<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>目录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 20px;
        }
        .image-container {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            background: #ffffff;
            padding: 12px;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 10px;
        }
        .back-link {
            margin-top: 30px;
            color: #555;
            text-decoration: none;
            padding: 10px 28px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            font-weight: 500;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #2ecc71;
            color: white;
            box-shadow: 0 4px 16px rgba(46, 204, 113, 0.3);
        }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- 图片路径已修改为 images/picture.png -->
        <img src="images/picture.png" alt="展示图片" onerror="this.style.display='none'; document.getElementById('err').style.display='block';" />
        <div id="err" class="error-msg" style="display:none;">
            ⚠️ 图片加载失败，请检查路径是否正确。<br />
            当前路径：images/picture.png
        </div>
    </div>
    <a class="back-link" href="index.html">← 返回首页</a>
</body>
</html>
