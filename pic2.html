<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>摇滚风格</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 20px;
            padding: 30px 30px 30px 30px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }
        .image-container {
            margin-bottom: 24px;
        }
        .image-container img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }
        .back-btn {
            display: inline-block;
            padding: 14px 40px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background: #d1d5e0;
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .back-btn:hover {
            background: #b0b8c8;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10);
        }
        .back-btn:active {
            transform: translateY(0);
        }
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="image-container">
            <img src="images/pic2.png" alt="摇滚风格" onerror="this.style.display='none'; document.getElementById('err2').style.display='block';" />
            <div id="err2" class="error-msg" style="display:none;">
                ⚠️ 图片加载失败，请检查路径：images/pic2.png
            </div>
        </div>
        <a href="catalog.html" class="back-btn">← 返回</a>
    </div>
</body>
</html>
